
name: Extract ZIP into Repository

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"

  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP file name"
        required: true
        default: "railway-fernet-key-generator.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: findzip
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ZIP="${{ inputs.zip_path }}"
          else
            ZIP=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '\.zip$' | head -n 1)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ZIP not found: $ZIP"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Generator Files
        env:
          ZIP: ${{ steps.findzip.outputs.zip }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          archive = Path(os.environ["ZIP"])

          excluded = {
              ".git", ".github", "__pycache__",
              ".env", ".env.local", ".env.production",
              "env.txt"
          }

          blocked = {
              ".session", ".db", ".sqlite",
              ".sqlite3", ".log"
          }

          with zipfile.ZipFile(archive) as z:
              files = [i for i in z.infolist() if not i.is_dir()]

              # Remove one common wrapper directory if present.
              paths = [
                  PurePosixPath(i.filename.replace("\\", "/"))
                  for i in files
              ]

              first_parts = {p.parts[0] for p in paths if p.parts}
              strip_root = (
                  len(first_parts) == 1
                  and all(len(p.parts) > 1 for p in paths)
              )

              count = 0

              for item, path in zip(files, paths):
                  if path.is_absolute() or ".." in path.parts:
                      continue

                  parts = path.parts[1:] if strip_root else path.parts

                  if not parts:
                      continue

                  if any(part in excluded for part in parts):
                      print("Skipped:", item.filename)
                      continue

                  if PurePosixPath(parts[-1]).suffix.lower() in blocked:
                      print("Skipped:", item.filename)
                      continue

                  if parts[-1].lower().endswith(".zip"):
                      continue

                  target = (root / Path(*parts)).resolve()

                  if root not in target.parents:
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(item) as src:
                      target.write_bytes(src.read())

                  print("Extracted:", target.relative_to(root))
                  count += 1

          print("Total extracted:", count)

          if count == 0:
              raise SystemExit("No eligible files found.")
          PY

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract Railway key generator"
            git push
          else
            echo "No changes to commit"
          fi
